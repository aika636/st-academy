<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Тот же viewport, что у SillyTavern: без него телефонные ширины не имеют смысла. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>academy: стенд панели</title>

<!-- Настоящий style.css расширения, без правок. -->
<link rel="stylesheet" href="../../style.css">

<style>
/* ---- ПОДДЕЛКА ТАВЕРНЫ, а не её копия. -------------------------------------
 * Здесь лежит ровно то окружение, от которого зависит раскладка панели:
 * 1) враждебные правила таверны, уже укусившие один раз (дефект 1 из
 *    etap-live.md): `body .panelControlBar` — absolute, `drag-grabber` — тоже;
 * 2) грубое приближение `text_pole` и `menu_button` — паддинги и рамки, от
 *    которых зависит высота цели касания;
 * 3) поле ввода внизу, которое панель не имеет права перекрывать.
 * Чего здесь НЕТ: темы таверны, её шрифтов, её media-правил. Это стенд
 * раскладки, а не витрина вида. */
/* Глобальный reset таверны — дословно из её style.css:136. Без него вкладки
 * считаются content-box и ложатся в три строки, которых в живой сборке нет:
 * первый же прогон стенда поймал этот дефект у самого стенда. */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: rgb(30, 30, 35);
  color: rgb(220, 220, 210);
  font-family: "Noto Sans", sans-serif;
  font-size: 15px;
}
/* Враждебная раскладка таверны — дословно то, что ловил дефект 1. */
body .panelControlBar {
  position: absolute;
  right: 5px;
  top: 5px;
  z-index: 2000;
  display: flex;
  align-items: center;
  min-width: 100px;
  justify-content: space-evenly;
}
.drag-grabber { position: absolute; cursor: grab; }
.panelControlBar .drag-grabber { position: unset; }
/* Иконки fa не грузим — рисуем видимые заглушки того же размера. */
.fa-solid::before { content: "◦"; }
.fa-grip::before { content: "⠿"; }
.fa-circle-xmark::before { content: "✕"; }
/* Приближение штатных контролов таверны. */
.text_pole {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 5px;
  color: inherit;
  padding: 3px 5px;
}
.menu_button {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 5px;
  padding: 3px 5px;
  user-select: none;
  /* Дословно из таверны (style.css:3818): её кнопка считает ширину по самому
     длинному слову и потому ломает двухсловную подпись на две строки. Стенд
     этого не знал и потому пропустил дефект «Сменить / пресет». */
  width: min-content;
  margin: 5px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}
/* Поле ввода чата: панель не имеет права его накрывать (style.css, правило 3). */
#send_form {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex; gap: 6px;
  padding: 8px;
  background: rgba(0, 0, 0, 0.6);
}
#send_form textarea { flex: 1; height: 44px; }
/* Псевдочат, чтобы было что прокручивать под панелью. */
#chat { padding: 12px 12px 120px; opacity: 0.5; max-width: 40em; }
</style>
</head>
<body>

<div id="movingDivs"></div>
<div id="chat"></div>
<form id="send_form"><textarea class="text_pole" placeholder="Сообщение…"></textarea><div class="menu_button">➤</div></form>

<script type="module">
// Стенд собирает состояние идущего семестра тем же путём, что тесты
// (test/ui-dom.test.mjs): пресет + core/*, никакой таверны. Хост поддельный,
// действия отвечают с задержкой, чтобы было видно состояние «идёт запрос».
import ui, { promptDoctorView } from '../../ui.js';
import { createState } from '../../core/state.mjs';
import { buildSchedule } from '../../core/schedule.mjs';
import { addGrade } from '../../core/gradebook.mjs';
import { changeRelation } from '../../core/relations.mjs';

const preset = await (await fetch('../../presets/ru-university.json')).json();

// Корпус и аудитория (9.7A п.11): у химии — оба, у матанализа — длинный
// корпус (перенос на 360px), у остальных — нет.
const SUBJECTS = [
  { id: 'chem', name: 'аналитическая химия', teacherId: 'petrova', building: 'главный', room: '214' },
  { id: 'math', name: 'математический анализ и теория функций', teacherId: 'sokolovsky', building: 'учебно-лабораторный корпус имени Менделеева', room: 'Большая химическая' },
  { id: 'phil', name: 'философия', teacherId: 'grigoryan' },
  { id: 'pe', name: 'физическая культура', teacherId: null },
];
// Портрет (9.7A п.15): у Петровой — настоящая картинка стенда, у
// Соколовского — битый путь (ветка «картинка не открылась»).
const TEACHERS = [
  {
    id: 'petrova', name: 'Петрова Анна Сергеевна', traits: ['злопамятна', 'придирается к опозданиям'], portrait: 'portrait.svg',
    post: 'заведующая кафедрой аналитической химии', likes: 'белое вино и дорогие картины', secret: 'влюблена в Соколовского и скрывает это от кафедры',
  },
  { id: 'sokolovsky', name: 'Соколовский Владимир Константинович', traits: ['рассеян', 'любит доказательства у доски'], portrait: 'characters/нет/такого.png' },
  { id: 'grigoryan', name: 'Григорян Ашот Суренович', traits: [] },
];

// ?fresh=1 — семестр не начат: анкета и таблица раскрыты, кнопка старта живая.
const fresh = new URLSearchParams(location.search).has('fresh');

function makeState() {
  let s = createState(preset, {
    survey: {
      era: 'современность', country: 'Россия', institution: 'университет',
      faculty: 'химический', year: '2-й', lang: 'русский',
    },
    subjects: SUBJECTS,
    teachers: TEACHERS,
    schedule: buildSchedule(SUBJECTS, preset),
    startDay: '2026-09-01',
  });
  if (fresh) return s;

  s.started = true;
  // Седьмая неделя, среда, вторая пара идёт.
  s.calendar.day = '2026-10-14';
  s.calendar.time = '10:15';
  s.calendar.precision = 'datetime';
  s.calendar.moved = 23;
  s.calendar.idle = 0;
  s.calendar.source = 'A';

  // Оценки: у math — хвост, чтобы жила красная рамка и «Хвосты».
  for (const [subjectId, value, day] of [
    ['chem', '5', '2026-09-18'], ['chem', '4', '2026-10-02'],
    ['math', '2', '2026-09-25'], ['phil', '5', '2026-10-09'],
  ]) s = addGrade(s, { subjectId, value, day }, preset).state;

  // Сдвиги отношений — история ярлыков на вкладке «Люди».
  for (const [teacherId, delta] of [
    ['petrova', -2], ['petrova', -1], ['sokolovsky', 2], ['sokolovsky', 1],
  ]) s = changeRelation(s, { teacherId, delta, reason: 'стенд' }, preset).state;

  // Исход проверки сегодня (9.4.1) — строка с кубиком на «Сегодня»; и итог,
  // который мир ещё не знает (9.4.3), — строка «итог объявят» в зачётке.
  s.exams.items = [
    {
      id: '0:phil:credit', subjectId: 'phil', kind: 'credit', day: '2026-10-14', outcome: 'зачёт', attempts: 1,
      rolls: [{ day: '2026-10-14', roll: 17, dc: 7, tier: 'critSuccess', value: 'зачёт' }],
    },
    {
      id: '0:chem:exam', subjectId: 'chem', kind: 'exam', day: '2026-10-14', outcome: '2', attempts: 1,
      announced: false, announceOn: '2026-10-15',
      rolls: [{ day: '2026-10-14', roll: 3, dc: 9, tier: 'fail', value: '2' }],
    },
  ];

  return s;
}

let state = makeState();

const settings = {
  mode: 'auto',
  debug: true, // пять вкладок — худший случай для flex-wrap
  lorebook: { enabled: true, book: '' },
  api: { endpoint: '', key: '', model: '' },
  ui: {},
};

const lorebook = fresh ? { enabled: true, reason: 'no-state', name: '', measure: null, suggest: [], orphans: [], error: null } : {
  enabled: true,
  name: 'Academy chat-1',
  reason: null,
  error: null,
  measure: { entries: 7, chars: 1400, tokens: 460, cap: 60, withinCap: true },
  suggest: [{ uid: 'academy:npc:masha', keys: ['Маша', 'Лебедева'], content: 'соседка по общежитию, рисует комиксы' }],
  orphans: [{ uid: 'academy:chronicle:exam:2025-12-22:chem' }],
};

const lastRun = fresh ? null : {
  mesId: 42,
  source: 'received',
  permission: '',
  notes: [],
  injects: ['academy_status: среда, 14 октября, 7-я неделя, 2-я пара — математический анализ'],
  debug: {
    mode: 'auto', source: 'A', moved: true, idle: 0, stalled: false,
    marker: '📅 Среда, 14 октября | 🕰 10:15',
    applied: [
      { kind: 'time', day: '2026-10-14', time: '10:15' },
      { kind: 'rel', teacherId: 'petrova', delta: -1 },
    ],
    rejected: [{ raw: '⏰ 25:70', reason: 'не время' }],
    notes: [],
  },
};

const merge = (into, patch) => {
  for (const [k, v] of Object.entries(patch || {})) {
    if (v && typeof v === 'object' && !Array.isArray(v) && into[k] && typeof into[k] === 'object') merge(into[k], v);
    else into[k] = v;
  }
};

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const host = {
  getState: () => state,
  getReport: () => ({ status: state ? 'ok' : 'empty', state, errors: [] }),
  getPreset: () => preset,
  getSettings: () => settings,
  setSettings: (patch) => { merge(settings, patch); },
  getDebug: () => lastRun,
  markerVisibleRisk: () => true, // предупреждение про encode_tags — пусть тоже стоит в раскладке
  getLorebook: () => lorebook,
  // Доктор промпта (9.7A п.4): свои инжекты, сосед Scene State, просящий
  // первую строку ближе к концу промпта, и телефон в конце ответа.
  getPromptDoctor: () => promptDoctorView({
    prompts: {
      academy_status: { value: 'среда, 14 октября, 2-я пара — матанализ', position: 1, depth: 1, role: 0 },
      academy_marker: { value: 'Первой строкой ответа поставь метку <!-- [ACADEMY …] -->', position: 1, depth: 2, role: 0 },
      academy_oneshot: { value: '', position: 1, depth: 0, role: 0 },
      '2_floating_prompt': { value: 'Заметка автора: сцена в общежитии.', position: 1, depth: 4, role: 0 },
      scene_state_extension_with_a_very_long_key: { value: 'MANDATORY: begin your response with the scene state block, then the story.', position: 1, depth: 0, role: 0 },
      bb_phone: { value: 'Append the phone status line at the end of your response.', position: 1, depth: 1, role: 0 },
    },
    own: ['academy_status', 'academy_marker', 'academy_oneshot'],
    markerKey: 'academy_marker',
    markerSeen: false,
    lastText: '<div class="scene-state">📍 Общежитие · 🕰 10:15</div>\nОна проснулась.',
    encodeTags: false,
  }),
  getPresets: () => ({
    active: 'ru-university',
    list: [
      { id: 'ru-university', name: 'Российский вуз' },
      { id: 'jp-highschool', name: 'Японская школа' },
      { id: 'magic-academy', name: 'Магическая академия' },
      // Свой пресет (9.3.2): у него на стенде видна кнопка «Удалить».
      { id: 'my-uni', name: 'Вуз подруги', user: true },
    ],
    notice: '',
  }),
  actions: Object.fromEntries([
    'exportState', 'importState', 'guessSurvey', 'setPreset', 'syncLorebook',
    'suggestLorebookEntry', 'acceptLorebookSuggestion', 'pruneLorebook', 'generatePlan',
    'setSubjects', 'manualTime', 'testApi', 'listModels', 'startTerm',
    'exportPreset', 'previewPreset', 'importPreset', 'deletePreset', 'setTeacherDetails',
  ].map((name) => [name, async (...args) => {
    await wait(250);
    if (name === 'exportState') return { ok: true, json: JSON.stringify({ state }), filename: 'academy.json', warnings: [] };
    if (name === 'listModels') return { ok: true, models: ['glm-5.1', 'gpt-5-mini'], via: 'tavern-backend' };
    if (name === 'exportPreset') return { ok: true, json: JSON.stringify({ format: 'academy-preset', version: 1, preset }), filename: `academy-preset-${args[0]}.json` };
    // Превью на стенде — длинное имя и замечания: проверить перенос на 360px.
    if (name === 'previewPreset') {
      return {
        ok: true,
        summary: { id: 'ru-university-2', name: 'Санкт-Петербургский государственный университет телекоммуникаций', line: 'семестр · пары в день: 4 · 2–5 · хвост после 3 прогулов' },
        renamed: true,
        warnings: ['пресет без конверта — принят как файл из папки пресетов', 'limits.journalSize: 100000 за рамками 10–1000, взято 1000'],
      };
    }
    if (name === 'importPreset') return { ok: true, added: 'ru-university-2', name: 'Вуз подруги (2)' };
    if (name === 'pruneLorebook') return { ok: true, removed: 1 };
    if (name === 'guessSurvey') return { ok: true, survey: state.survey, filled: ['era', 'country'] };
    if (name === 'setSubjects') { const rows = args[0] || {}; state.subjects = rows.subjects || state.subjects; state.teachers = rows.teachers || state.teachers; return { ok: true }; }
    if (name === 'startTerm') { state.started = true; return { ok: true }; }
    if (name === 'setTeacherDetails') {
      const t = state.teachers.find((x) => x.id === args[0]);
      const p = args[1] || {};
      if (t) {
        for (const key of ['portrait', 'post', 'likes', 'secret']) if (key in p) t[key] = String(p[key] || '').trim() || undefined;
        if ('traits' in p) t.traits = String(p.traits || '').split(',').map((x) => x.trim()).filter(Boolean);
      }
      return { ok: true };
    }
    return { ok: true };
  }])),
};

const api = ui.mountPanel(host);
ui.mountButton(host);
api.open();
window.__academy = { host, api, ui, state, settings };
document.title = fresh ? 'academy: стенд (семестр не начат)' : 'academy: стенд (7-я неделя)';
</script>
</body>
</html>
